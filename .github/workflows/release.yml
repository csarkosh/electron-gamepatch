name: release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Electron version to republish, e.g. 44.1.1 (empty = whatever upstream released that we have not)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$REQUESTED" ]; then
            [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 44.1.1, got: $REQUESTED" >&2; exit 1; }
            echo "versions=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release list -R electron/electron --exclude-pre-releases --limit 200 --json tagName -q '.[].tagName' > upstream.txt
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' > ours.txt || : > ours.txt
          versions=$(python3 tools/release_plan.py upstream.txt ours.txt)
          echo "plan: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          # build has read-only permissions: a draft is treated as not-released here, but never
          # deleted — deleting (so publish can recreate it) is publish's job, which has write access.
          state=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft' 2>/dev/null || echo "missing")
          if [ "$state" = "false" ]; then
            released=true; echo "v$VERSION already released; skipping"
          elif [ "$state" = "true" ]; then
            released=false; echo "v$VERSION exists only as a draft; rebuilding (publish will delete and recreate it)"
          else
            released=false
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
      - name: gate — unit, build, verify, integration suite, probe (same action as ci.yml)
        if: steps.exists.outputs.released == 'false'
        uses: ./.github/actions/gate
        with:
          version: ${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        if: steps.exists.outputs.released == 'false'
        with:
          name: dist-${{ matrix.version }}
          path: dist/
          if-no-files-found: error

  probe-windows:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.versions != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: skip if already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          state=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft' 2>/dev/null || echo "missing")
          if [ "$state" = "false" ]; then released=true; else released=false; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/probe-windows
        if: steps.exists.outputs.released == 'false'
        with:
          version: ${{ matrix.version }}

  publish:
    needs: [plan, build, probe-windows]
    # build is fail-fast: false; per-version legs must not block each other
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.versions != '[]' && needs.probe-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          state=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft' 2>/dev/null || echo "missing")
          if [ "$state" = "false" ]; then released=true
          elif [ "$state" = "true" ]; then echo "v$VERSION exists only as a draft; deleting it so publish can recreate it"; gh release delete "v$VERSION" -R "$GITHUB_REPOSITORY" --yes; released=false
          else released=false; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.released == 'false'
        with:
          name: dist-${{ matrix.version }}
          path: dist/
      - name: pass-through, checksums, notes
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          python3 tools/gamepatch.py passthrough --version "$VERSION"
          python3 tools/gamepatch.py check-dist --version "$VERSION"
          python3 tools/gamepatch.py shasums > dist/SHASUMS256.txt
          python3 tools/gamepatch.py notes --version "$VERSION" > notes.md
          cat dist/SHASUMS256.txt
      - name: publish release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" \
            --title "Electron v$VERSION, game-patched" \
            --notes-file notes.md \
            dist/*.zip dist/SHASUMS256.txt
