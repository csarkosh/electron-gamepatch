name: gate
description: "Unit tests, build, verify, integration suite and behavioural probe for one Electron version. Leaves dist/."
inputs:
  version:
    description: "Electron version, e.g. 44.1.1"
    required: true
runs:
  using: composite
  steps:
    - name: cache upstream downloads
      uses: actions/cache@v4
      with:
        path: cache
        key: upstream-${{ inputs.version }}-darwin-arm64-win32-x64
    - name: unit tests
      shell: bash
      run: python3 -m unittest discover -s tests -v
    - name: build darwin-arm64
      shell: bash
      run: python3 tools/gamepatch.py build --version "${{ inputs.version }}" --platform darwin-arm64
    - name: verify
      shell: bash
      run: python3 tools/verify.py --version "${{ inputs.version }}" --platform darwin-arm64
    - name: build win32-x64
      shell: bash
      run: python3 tools/gamepatch.py build --version "${{ inputs.version }}" --platform win32-x64
    - name: verify win32-x64
      shell: bash
      run: python3 tools/verify.py --version "${{ inputs.version }}" --platform win32-x64
    - name: stage win32-x64 zips for the Windows probe
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p probe-win32
        cp "dist/electron-v${{ inputs.version }}-win32-x64.zip" probe-win32/patched.zip
        cp "cache/v${{ inputs.version }}/electron-v${{ inputs.version }}-win32-x64.zip" probe-win32/stock.zip
    - name: upload win32-x64 for the Windows probe
      uses: actions/upload-artifact@v4
      with:
        name: probe-win32-${{ inputs.version }}
        path: probe-win32/
        if-no-files-found: error
        retention-days: 1
    - name: integration suite (pipeline + consumer contract)
      shell: bash
      env:
        GAMEPATCH_PIN: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: python3 -m unittest discover -s tests/integration -v
    - name: behavioural probe (blocking)
      shell: bash
      run: |
        set -euo pipefail
        test/probe/run.sh "$PWD/work/darwin-arm64/patched/Electron.app" | tee probe.json
        echo "--- stock control (must FAIL; proves the probe can tell them apart on this runner)"
        set +e
        test/probe/run.sh "$PWD/work/darwin-arm64/stock/Electron.app"
        rc=$?
        set -e
        # Only exit code 1 ("ran and failed") is a control. 0 means the runner delivered no
        # keystrokes; 2 (timeout) and 3 (keystroke command failed) mean the probe never got to
        # measure anything, so a stock "failure" would prove nothing about the patched pass.
        if [ "$rc" -eq 0 ]; then
          echo "stock passed the probe: the runner is not delivering real keystrokes, result is meaningless" >&2; exit 1
        fi
        if [ "$rc" -ne 1 ]; then
          echo "stock control inconclusive (exit $rc: timeout or keystroke failure)" >&2; exit 1
        fi
    - name: upload probe result
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-${{ inputs.version }}
        path: probe.json
