name: probe-windows
description: "Behavioural probe of the win32-x64 build on a Windows runner: patched must pass, stock must fail."
inputs:
  version:
    description: "Electron version, e.g. 44.1.1"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: probe-win32-${{ inputs.version }}
        path: probe-win32
    - name: unpack
      shell: pwsh
      run: |
        Expand-Archive probe-win32/patched.zip -DestinationPath probe-win32/patched
        Expand-Archive probe-win32/stock.zip -DestinationPath probe-win32/stock
    - name: behavioural probe (blocking)
      shell: cmd
      run: |
        call test\probe\run.cmd "%CD%\probe-win32\patched" > probe-win32-x64.json
        if errorlevel 1 ( type probe-win32-x64.json & echo patched electron.exe FAILED the probe 1>&2 & exit /b 1 )
        type probe-win32-x64.json
        echo --- stock control (must FAIL; proves the runner delivers real keystrokes)
        call test\probe\run.cmd "%CD%\probe-win32\stock" > probe-win32-x64-stock.json
        if not errorlevel 1 ( type probe-win32-x64-stock.json & echo stock passed the probe: the runner is not delivering real keystrokes, result is meaningless 1>&2 & exit /b 1 )
        type probe-win32-x64-stock.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-win32-x64-${{ inputs.version }}
        path: probe-win32-x64*.json
