name: probe-windows
description: "Behavioural probe of the win32-x64 build on a Windows runner: patched must pass, stock must fail."
inputs:
  version:
    description: "Electron version, e.g. 44.1.1"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: probe-win32-${{ inputs.version }}
        path: probe-win32
    - name: unpack
      shell: pwsh
      run: |
        Expand-Archive probe-win32/patched.zip -DestinationPath probe-win32/patched
        Expand-Archive probe-win32/stock.zip -DestinationPath probe-win32/stock
    - name: behavioural probe (blocking)
      shell: cmd
      run: |
        call test\probe\run.cmd "%CD%\probe-win32\patched" > probe-win32-x64.json
        if %ERRORLEVEL% neq 0 ( type probe-win32-x64.json & echo patched electron.exe FAILED the probe 1>&2 & exit /b 1 )
        type probe-win32-x64.json
        echo --- stock control (must FAIL; proves the runner delivers real keystrokes)
        call test\probe\run.cmd "%CD%\probe-win32\stock" > probe-win32-x64-stock.json
        set STOCK_RC=%ERRORLEVEL%
        type probe-win32-x64-stock.json
        rem Only exit code 1 ("ran and failed") is a control. 0 means the runner delivered no
        rem keystrokes; 2 (timeout) and 3 (keystroke command failed) mean the probe never got to
        rem measure anything, so a stock "failure" would prove nothing about the patched pass.
        if %STOCK_RC% equ 0 ( echo stock passed the probe: the runner is not delivering real keystrokes, result is meaningless 1>&2 & exit /b 1 )
        if %STOCK_RC% neq 1 ( echo stock control inconclusive ^(exit %STOCK_RC%: timeout or keystroke failure^) 1>&2 & exit /b 1 )
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-win32-x64-${{ inputs.version }}
        path: probe-win32-x64*.json
